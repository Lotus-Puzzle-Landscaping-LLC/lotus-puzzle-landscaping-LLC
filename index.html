<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Puzzle Landscaping - Quotes</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --dark-green: #1b5e20;
            --light-green: #e8f5e9;
            --accent: #81c784;
            --text-color: #333;
            --bg-glass: rgba(255, 255, 255, 0.94);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        #seasonal-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.85;
        }

        header {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            background: #111;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.8rem;
            color: #b0bec5;
            font-weight: 300;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-switch {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 5px 9px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            background: #fff;
            color: #000;
        }
        .lang-btn.active {
            background: var(--accent);
            color: var(--dark-green);
            font-weight: bold;
            border-color: var(--accent);
        }

        .header-cart-btn {
            background: var(--dark-green);
            color: white;
            border: 1px solid var(--accent);
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background 0.2s;
        }
        .header-cart-btn:hover {
            background: var(--primary-green);
            transform: scale(1.05);
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
            background: var(--bg-glass);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .intro h2 { color: var(--dark-green); margin-bottom: 10px; }
        .intro p { color: #555; }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            padding-bottom: 120px;
        }

        .category-card {
            background: var(--bg-glass);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid #c8e6c9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .category-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .category-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .category-content {
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .category-card h3 {
            color: var(--dark-green);
            margin-bottom: 10px;
            font-size: 1.25rem;
        }

        .category-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--dark-green);
        }

        .products-view {
            display: none;
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 30px auto;
            background: var(--bg-glass);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            margin-bottom: 100px;
        }

        .back-btn {
            background: #616161;
            margin-bottom: 30px;
        }
        .back-btn:hover { background: #424242; }

        .products-list {
            list-style: none;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
            gap: 15px;
        }
        .product-item:last-child { border-bottom: none; }
        .product-name { font-size: 1.05rem; font-weight: 500; color: #444; flex-grow: 1; }

        .qty-control {
            display: flex;
            align-items: center;
            background: #e0e0e0;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .qty-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .qty-btn:hover {
            background: var(--dark-green);
        }

        .qty-val {
            padding: 0 12px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #333;
            min-width: 30px;
            text-align: center;
        }

        .float-container {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 10;
        }

        .whatsapp-float {
            background: #25d366;
            color: white;
            padding: 15px 25px;
            border-radius: 40px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s;
            font-size: 0.9rem;
        }
        .whatsapp-float:hover { transform: scale(1.05); background: #128c7e; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 20;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-content h2 { color: var(--dark-green); }
        .cart-items { list-style: none; margin-bottom: 30px; max-height: 250px; overflow-y: auto; padding-right: 10px;}
        .cart-items li { padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 1rem;}
        
        .close-modal {
            background: #ef5350; color: white; border: none; width: 35px; height: 35px;
            border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; justify-content: center; align-items: center;
        }
        .close-modal:hover { background: #c62828; }

        .remove-item {
            color: #e53935; border: none; background: none; cursor: pointer; font-size: 1rem; margin-left: 15px;
        }

        .whatsapp-send-btn {
            width: 100%; background: #25d366; color: white; border: none; padding: 18px;
            border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            transition: background 0.3s;
        }
        .whatsapp-send-btn:hover { background: #128c7e; }

        @media (max-width: 768px) {
            header { padding: 10px; flex-direction: column; gap: 12px; text-align: center; }
            .header-brand { flex-direction: column; gap: 5px; }
            .header-controls { width: 100%; justify-content: center; }
            header h1 { font-size: 1.2rem; }
            header p { font-size: 0.7rem; }
            .container { margin: 20px auto; padding: 0 15px; }
            .categories-grid { grid-template-columns: 1fr; gap: 20px; }
            .float-container { left: 15px; bottom: 15px; }
        }
    </style>
</head>
<body>

    <canvas id="seasonal-canvas"></canvas>

    <header>
        <div class="header-brand">
            <img src="logo.jpeg" alt="Lotus Puzzle Landscaping Logo" onerror="this.src='https://via.placeholder.com/70?text=LOGO'">
            <div>
                <h1>Lotus Puzzle Landscaping</h1>
                <p id="txt-subtitle">Garden Design & Maintenance</p>
            </div>
        </div>
        <div class="header-controls">
            <button class="header-cart-btn" onclick="openCartModal()">
                🛒 <span id="txt-cart-btn">Quote</span> (<span id="cart-count">0</span>)
            </button>
            <div class="lang-switch">
                <button class="lang-btn active" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" onclick="setLanguage('es')">ES</button>
                <button class="lang-btn" onclick="setLanguage('pt')">PT</button>
                <button class="lang-btn" onclick="setLanguage('zh')">ZH</button>
            </div>
        </div>
    </header>

    <div class="container" id="main-menu">
        <div class="intro">
            <h2 id="txt-services-title">Our Services</h2>
            <p id="txt-services-desc">Select a category to see the jobs we offer. Personalized quotes.</p>
        </div>

        <div class="categories-grid" id="categories-container"></div>
    </div>

    <div id="products-view" class="products-view">
        <button class="btn back-btn" onclick="showMainMenu()" id="txt-back-btn">← Back to Categories</button>
        <h2 id="category-title" style="color: var(--dark-green); margin-bottom: 30px;"></h2>
        <ul class="products-list" id="products-container"></ul>
    </div>

    <div class="float-container">
        <a href="https://wa.me/19086567511?text=Hello,%20I%20would%20like%20more%20information." target="_blank" class="whatsapp-float" id="whatsapp-main-btn">
            💬 <span>Direct WhatsApp</span>
        </a>
    </div>

    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="txt-modal-title">Your Request</h2>
                <button class="close-modal" onclick="closeCartModal()">×</button>
            </div>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 20px;" id="txt-modal-desc">Review your selection and send it to receive a personalized quote. Prices vary based on the job.</p>
            
            <ul class="cart-items" id="cart-items-list"></ul>
            
            <button class="whatsapp-send-btn" onclick="sendWhatsAppQuote()">
                💬 <span id="txt-send-btn">Send via WhatsApp</span>
            </button>
        </div>
    </div>

<script>
        const uiText = {
            en: {
                subtitle: "Garden Design & Maintenance",
                cartBtn: "Quote",
                servicesTitle: "Our Services",
                servicesDesc: "Select a category to see the jobs we offer. Personalized quotes.",
                viewServices: "View Services",
                backBtn: "← Back to Categories",
                whatsappDirect: "Direct WhatsApp",
                modalTitle: "Your Request",
                modalDesc: "Review your selection and send it to receive a personalized quote. Prices vary based on the job.",
                emptyCart: "No services selected.",
                sendBtn: "Send via WhatsApp",
                selectAlert: "Please select at least one service.",
                whatsappMsg: "Hello, I would like to request a quote for the following gardening services:%0A"
            },
            es: {
                subtitle: "Diseño y Cuidado de Jardines",
                cartBtn: "Cotización",
                servicesTitle: "Nuestros Servicios",
                servicesDesc: "Selecciona una categoría para ver los trabajos que ofrecemos. Cotizaciones personalizadas.",
                viewServices: "Ver Servicios",
                backBtn: "← Volver a Categorías",
                whatsappDirect: "WhatsApp Directo",
                modalTitle: "Tu Solicitud",
                modalDesc: "Revisa tu selección y envíala para recibir una cotización personalizada. Los precios varían según el trabajo.",
                emptyCart: "No has seleccionado servicios.",
                sendBtn: "Enviar por WhatsApp",
                selectAlert: "Selecciona al menos un servicio.",
                whatsappMsg: "Hola, me gustaría solicitar una cotización para los siguientes servicios de jardinería:%0A"
            },
            pt: {
                subtitle: "Design e Manutenção de Jardins",
                cartBtn: "Orçamento",
                servicesTitle: "Nossos Serviços",
                servicesDesc: "Selecione uma categoria para ver os serviços disponíveis. Orçamentos personalizados.",
                viewServices: "Ver Serviços",
                backBtn: "← Voltar às Categorias",
                whatsappDirect: "WhatsApp Direto",
                modalTitle: "Seu Pedido",
                modalDesc: "Revise sua seleção e envie para receber um orçamento personalizado. Os preços variam de acordo com o trabalho.",
                emptyCart: "Nenhum serviço selecionado.",
                sendBtn: "Enviar por WhatsApp",
                selectAlert: "Por favor, selecione pelo menos um serviço.",
                whatsappMsg: "Olá, gostaria de solicitar um orçamento para os seguintes serviços de jardinagem:%0A"
            },
            zh: {
                subtitle: "园艺设计与维护",
                cartBtn: "报价单",
                servicesTitle: "我们的服务",
                servicesDesc: "选择一个类别查看我们提供的服务。个性化定制报价。",
                viewServices: "查看服务",
                backBtn: "← 返回类别",
                whatsappDirect: "WhatsApp 直连",
                modalTitle: "您的需求",
                modalDesc: "检查您的选择并发送以获取个性化报价。价格因工作而异。",
                emptyCart: "未选择任何服务。",
                sendBtn: "通过 WhatsApp 发送",
                selectAlert: "请至少选择一项服务。",
                whatsappMsg: "您好，我想咨询以下园艺服务的报价：%0A"
            }
        };

        const db = {
            categories: {
                en: [
                    { id: "cat1", name: "Lawn Maintenance", desc: "Mowing, treatments, and weed control.", img: "Mantenimientocesped.jpg" },
                    { id: "cat2", name: "Plant & Tree Care", desc: "Pruning, planting, and mulching.", img: "cuidadoplantas.jpg" },
                    { id: "cat3", name: "Landscaping & Hardscaping", desc: "Pavers, walls, fences, and decks.", img: "landscaping.jpg" },
                    { id: "cat4", name: "Special Services", desc: "Cleanups, pressure washing, and pest control.", img: "servesp.jpg" }
                ],
                es: [
                    { id: "cat1", name: "Mantenimiento de Césped", desc: "Cortes, tratamientos y control de maleza.", img: "Mantenimientocesped.jpg" },
                    { id: "cat2", name: "Cuidado de Plantas y Árboles", desc: "Poda, siembra y mulch.", img: "cuidadoplantas.jpg" },
                    { id: "cat3", name: "Paisajismo y Construcción (Hardscaping)", desc: "Adoquines, muros, cercas y decks.", img: "landscaping.jpg" },
                    { id: "cat4", name: "Servicios Especiales", desc: "Limpieza, lavado a presión y control de plagas.", img: "servesp.jpg" }
                ],
                pt: [
                    { id: "cat1", name: "Manutenção de Gramados", desc: "Corte, tratamentos e controle de ervas daninhas.", img: "Mantenimientocesped.jpg" },
                    { id: "cat2", name: "Cuidado com Plantas e Árvores", desc: "Poda, plantio e cobertura morta (mulch).", img: "cuidadoplantas.jpg" },
                    { id: "cat3", name: "Paisagismo e Hardscaping", desc: "Pavimentos, muros, cercas e decks.", img: "landscaping.jpg" },
                    { id: "cat4", name: "Serviços Especiais", desc: "Limpeza, lavagem a pressão e controle de pragas.", img: "servesp.jpg" }
                ],
                zh: [
                    { id: "cat1", name: "草坪护理与维护", desc: "修剪、护理和杂草控制。", img: "Mantenimientocesped.jpg" },
                    { id: "cat2", name: "植物与树木护理", desc: "修剪、种植和覆盖物鋪設。", img: "cuidadoplantas.jpg" },
                    { id: "cat3", name: "景观设计与硬质景观", desc: "铺路石、挡土墙、栅栏和露台平台。", img: "landscaping.jpg" },
                    { id: "cat4", name: "特色专项服务", desc: "清理、高压清洗和害虫防治。", img: "servesp.jpg" }
                ]
            },
            products: {
                en: {
                    cat1: [ "Weekly Grass Cut", "Bi-Weekly Grass Cut", "Weed Control", "Aeration", "Aeration Treatment" ],
                    cat2: [ "Trimming", "Pruning", "Mulching", "Planting", "Sodding", "Seeding" ],
                    cat3: [ "Paver Installation", "Patio Installation", "Retaining Walls", "Fence Installation", "Deck Installation", "Hardscaping" ],
                    cat4: [ "Clean Up", "Pressure Washing", "Mosquito Control (Natural Ingredients)" ]
                },
                es: {
                    cat1: [ "Corte de Césped Semanal", "Corte de Césped Quincenal", "Control de Maleza", "Aeración", "Tratamiento de Aeración" ],
                    cat2: [ "Recorte y Perfilado", "Poda", "Mulching / Acolchado", "Plantación", "Instalación de Pasto (Sod)", "Siembra" ],
                    cat3: [ "Instalación de Adoquines", "Instalación de Patios", "Muros de Contención", "Instalación de Cercas", "Instalación de Terrazas/Decks", "Hardscaping (Construcción dura)" ],
                    cat4: [ "Limpieza General de Temporada", "Lavado a Presión", "Control de Mosquitos (Ingredientes Naturales)" ]
                },
                pt: {
                    cat1: [ "Corte de Grama Semanal", "Corte de Grama Quinzenal", "Controle de Ervas Daninhas", "Aeração do Solo", "Tratamento de Aeração" ],
                    cat2: [ "Aparagem e Contorno", "Poda de Árvores e Arbustos", "Aplicação de Mulch", "Plantio de Flores e Plantas", "Instalação de Grama em Rolo (Sod)", "Semeio de Gramados" ],
                    cat3: [ "Instalação de Pavimentos (Pavers)", "Construção de Pátios", "Muros de Arrimo / Contenção", "Instalação de Cercas", "Instalação de Decks", "Hardscaping (Obras de Pedra/Madeira)" ],
                    cat4: [ "Limpeza Geral de Temporada", "Lavagem a Alta Pressão", "Controle de Mosquitos (Ingredientes Naturais)" ]
                },
                zh: {
                    cat1: [ "每周割草", "双周割草", "除草与杂草控制", "草坪打孔透气", "草坪打孔护理" ],
                    cat2: [ "绿篱修剪与造型", "树木与植物修剪", "树皮覆盖 (Mulching)", "花草树木种植", "铺设新草皮 (Sod)", "草坪播种" ],
                    cat3: [ "铺路石安装", "庭院铺设", "挡土墙建造", "栅栏围栏安装", "木质露台搭建", "硬质景观工程 (Hardscaping)" ],
                    cat4: [ "季节性全面清理", "高压水枪清洗", "蚊虫防治 (天然成分)" ]
                }
            }
        };

        let currentLang = 'en';
        let cart = {};

        function setLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = Array.from(document.querySelectorAll('.lang-btn')).find(btn => btn.textContent.trim().toLowerCase() === lang);
            if (activeBtn) activeBtn.classList.add('active');

            const ui = uiText[lang];
            document.getElementById('txt-subtitle').innerText = ui.subtitle;
            document.getElementById('txt-cart-btn').innerText = ui.cartBtn;
            document.getElementById('txt-services-title').innerText = ui.servicesTitle;
            document.getElementById('txt-services-desc').innerText = ui.servicesDesc;
            document.getElementById('txt-back-btn').innerText = ui.backBtn;
            document.getElementById('whatsapp-main-btn').querySelector('span').innerText = ui.whatsappDirect;
            document.getElementById('txt-modal-title').innerText = ui.modalTitle;
            document.getElementById('txt-modal-desc').innerText = ui.modalDesc;
            document.getElementById('txt-send-btn').innerText = ui.sendBtn;

            const currentCatId = document.getElementById('products-view').getAttribute('data-current-cat');
            if (currentCatId) {
                renderProducts(currentCatId);
                const catObj = db.categories[lang].find(c => c.id === currentCatId);
                if (catObj) document.getElementById('category-title').innerText = catObj.name;
            }

            renderCategories();
        }

        function renderCategories() {
            const container = document.getElementById("categories-container");
            container.innerHTML = "";
            const cats = db.categories[currentLang];
            cats.forEach(cat => {
                const card = document.createElement("div");
                card.className = "category-card";
                card.onclick = () => showProducts(cat.id);
                card.innerHTML = `
                    <img src="${cat.img}" class="category-img" alt="${cat.name}" onerror="this.src='https://via.placeholder.com/400x180?text=Landscaping'">
                    <div class="category-content">
                        <div>
                            <h3>${cat.name}</h3>
                            <p>${cat.desc}</p>
                        </div>
                        <button class="btn cat-btn-text">${uiText[currentLang].viewServices}</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showProducts(catId) {
            const catObj = db.categories[currentLang].find(c => c.id === catId);
            document.getElementById("main-menu").style.display = "none";
            const productsView = document.getElementById("products-view");
            productsView.style.display = "block";
            productsView.setAttribute('data-current-cat', catId);
            document.getElementById("category-title").innerText = catObj ? catObj.name : "";
            
            renderProducts(catId);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderProducts(catId) {
            const prodContainer = document.getElementById("products-container");
            prodContainer.innerHTML = "";
            const products = db.products[currentLang][catId];
            
            products.forEach(prod => {
                const qty = cart[prod] || 0;
                const li = document.createElement("li");
                li.className = "product-item";
                li.innerHTML = `
                    <span class="product-name">🌿 ${prod}</span>
                    <div class="qty-control">
                        <button class="qty-btn" onclick="updateQty('${prod}', -1)">-</button>
                        <span class="qty-val" id="qty-${prod}">${qty}</span>
                        <button class="qty-btn" onclick="updateQty('${prod}', 1)">+</button>
                    </div>
                `;
                prodContainer.appendChild(li);
            });
        }

        function updateQty(productName, change) {
            let currentQty = cart[productName] || 0;
            currentQty += change;
            if (currentQty < 0) currentQty = 0;

            if (currentQty === 0) {
                delete cart[productName];
            } else {
                cart[productName] = currentQty;
            }

            let totalItems = 0;
            for (let key in cart) {
                totalItems += cart[key];
            }
            document.getElementById("cart-count").innerText = totalItems;

            const qtyEl = document.getElementById(`qty-${productName}`);
            if (qtyEl) {
                qtyEl.innerText = currentQty;
            }
        }

        function showMainMenu() {
            document.getElementById("products-view").style.display = "none";
            document.getElementById("main-menu").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openCartModal() {
            const listEl = document.getElementById("cart-items-list");
            listEl.innerHTML = "";
            const keys = Object.keys(cart);

            if(keys.length === 0) {
                listEl.innerHTML = `<li>${uiText[currentLang].emptyCart}</li>`;
            } else {
                keys.forEach((item) => {
                    listEl.innerHTML += `<li>${item} (x${cart[item]}) <button class="remove-item" onclick="removeEntireItem('${item}')">❌</button></li>`;
                });
            }
            document.getElementById("cart-modal").style.display = "flex";
        }

        function closeCartModal() {
            document.getElementById("cart-modal").style.display = "none";
        }

        function removeEntireItem(productName) {
            delete cart[productName];
            let totalItems = 0;
            for (let key in cart) {
                totalItems += cart[key];
            }
            document.getElementById("cart-count").innerText = totalItems;
            
            const qtyEl = document.getElementById(`qty-${productName}`);
            if (qtyEl) {
                qtyEl.innerText = 0;
            }
            openCartModal();
        }

        function sendWhatsAppQuote() {
            const keys = Object.keys(cart);
            if(keys.length === 0) {
                alert(uiText[currentLang].selectAlert);
                return;
            }
            
            let message = uiText[currentLang].whatsappMsg;
            keys.forEach((item, i) => {
                message += `${i+1}. ${item} (Qty: ${cart[item]})%0A`;
            });
            
            const phoneNumber = "19086567511";
            window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
        }

        setLanguage('en');

        const canvas = document.getElementById("seasonal-canvas");
        const ctx = canvas.getContext("2d");
        let particles = [];
        const particleCount = 30;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        const month = new Date().getMonth();
        let season = "spring";
        if (month === 11 || month === 0 || month === 1) season = "winter";
        else if (month >= 2 && month <= 4) season = "spring";
        else if (month >= 5 && month <= 7) season = "summer";
        else season = "autumn";

        const emojiSets = {
            spring: ["🌸", "🌷", "🌹", "🌻", "🌼"],
            winter: ["❄️", "🌨️", "⭐", "⚪"],
            summer: ["🍃", "🌿", "🌱", "🍀"],
            autumn: ["🍂", "🍁", "🌰", "🌾"]
        };

        for (let i = 0; i < particleCount; i++) {
            const currentEmojis = emojiSets[season];
            const randomEmoji = currentEmojis[Math.floor(Math.random() * currentEmojis.length)];
            
            particles.push({
                emoji: randomEmoji,
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: Math.random() * 1.5 + 0.8,
                size: Math.random() * 14 + 12,
                angle: Math.random() * 360,
                spin: Math.random() * 0.02 - 0.01
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.font = `${p.size}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(p.emoji, 0, 0);
                ctx.restore();

                p.y += p.speed;
                p.x += Math.sin(p.y / 40) * 0.6;
                p.angle += p.spin;

                if (p.y > canvas.height + 20) {
                    p.y = -20;
                    p.x = Math.random() * canvas.width;
                }
            });

            requestAnimationFrame(drawParticles);
        }

        drawParticles();
    </script>
